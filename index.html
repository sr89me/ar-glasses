<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AR Kính Mắt - Quản Lý Kho Qua Google Sheets</title>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #d2d4d9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 20px;
      overflow: hidden;
    }

    .duo-device {
      display: flex;
      width: 100%;
      max-width: 1180px;
      aspect-ratio: 16 / 10.2;
      background: #1c1c1e;
      border-radius: 46px;
      padding: 8px;
      gap: 6px;
      box-shadow: inset 0 0 2px rgba(255, 255, 255, 0.4), 0 40px 60px -15px rgba(0, 0, 0, 0.4);
    }

    .screen-left {
      flex: 0.82;
      max-width: 440px;
      background: #F9F6EF;
      border-radius: 38px 0 0 38px;
      padding: 25px 20px;
      overflow-y: auto;
      position: relative;
    }

    .screen-left::-webkit-scrollbar {
      width: 6px;
    }

    .screen-left::-webkit-scrollbar-track {
      background: transparent;
    }

    .screen-left::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.15);
      border-radius: 10px;
    }

    .shop-header-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .shop-header {
      font-size: 24px;
      font-weight: 700;
      color: #1d1d1f;
      letter-spacing: -0.5px;
    }

    .btn-sync {
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 12px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
      color: #1d1d1f;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    .btn-sync:hover {
      background: #f0f0f2;
      transform: translateY(-1px);
    }

    .btn-sync svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
      transition: transform 0.5s ease;
    }

    .btn-sync.spinning svg {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    .btn-studio {
      background: linear-gradient(135deg, #0070F3 0%, #00C6FF 100%);
      color: #fff;
      text-decoration: none;
      border-radius: 12px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(0, 112, 243, 0.25);
    }

    .btn-studio:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 198, 255, 0.35);
    }

    .btn-studio svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .source-notice {
      background: rgba(0, 122, 255, 0.08);
      color: #0066cc;
      border: 1px solid rgba(0, 122, 255, 0.2);
      padding: 7px 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .source-notice.warning {
      background: rgba(255, 149, 0, 0.1);
      color: #c46800;
      border-color: rgba(255, 149, 0, 0.25);
    }

    .glass-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 16px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .glass-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    }

    .glass-card.active {
      border-color: #007aff;
      box-shadow: 0 8px 25px rgba(0, 122, 255, 0.15);
    }

    .stock-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
    }

    .stock-in {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .stock-out {
      background: #ffebee;
      color: #c62828;
    }

    .card-top {
      display: flex;
      gap: 15px;
      align-items: center;
      margin-bottom: 12px;
    }

    .glass-img-wrap {
      width: 100px;
      height: 80px;
      background: #F9F6EF;
      border-radius: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    .glass-img-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      mix-blend-mode: multiply;
    }

    .glass-info {
      flex: 1;
      padding-right: 60px;
    }

    .glass-info h3 {
      font-size: 16px;
      font-weight: 600;
      color: #1d1d1f;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .price-box {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 6px;
    }

    .old-price {
      font-size: 13px;
      color: #86868b;
      text-decoration: line-through;
      font-weight: 500;
    }

    .sale-price {
      font-size: 17px;
      color: #e53935;
      font-weight: 700;
    }

    .specs {
      font-size: 13px;
      color: #86868b;
    }

    .btn-buy {
      background: #0068FF;
      color: #fff;
      text-decoration: none;
      text-align: center;
      padding: 10px 15px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }

    .btn-buy:hover {
      background: #0055d4;
    }

    .btn-buy.disabled {
      background: #e0e0e0;
      color: #9e9e9e;
      pointer-events: none;
    }

    .btn-buy svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .screen-right {
      flex: 1.25;
      background: #000;
      border-radius: 0 38px 38px 0;
      position: relative;
      overflow: hidden;
      cursor: crosshair;
    }

    /* Khung hình nhỏ hiển thị camera gốc khi chưa đeo kính AR (Picture-in-Picture) */
    .pip-original {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 144px;
      height: 96px;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.45);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 15px rgba(0, 122, 255, 0.2);
      background: #000;
      z-index: 70;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .pip-original:hover {
      transform: scale(1.04);
      border-color: #00F0FF;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 240, 255, 0.4);
    }

    .pip-original.expanded {
      width: 230px;
      height: 153px;
      border-color: #00F0FF;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.9), 0 0 25px rgba(0, 240, 255, 0.45);
    }

    .pip-original canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      display: block;
    }

    .pip-tag {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 8px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 2;
      letter-spacing: 0.3px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    video {
      display: none;
    }

    /* Focus HUD & Indicator */
    .focus-badge {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 60;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(12px);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .focus-badge:hover {
      background: rgba(0, 0, 0, 0.85);
      transform: scale(1.04);
      border-color: rgba(0, 229, 255, 0.5);
    }

    .focus-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00e5ff;
      transition: 0.3s;
    }

    .focus-dot.locked {
      background: #00e676;
      box-shadow: 0 0 8px #00e676;
    }

    .focus-dot.focusing {
      background: #ffea00;
      box-shadow: 0 0 8px #ffea00;
      animation: pulse-focus 0.6s infinite alternate;
    }

    .focus-dot.unsupported {
      background: #ff9100;
      box-shadow: 0 0 8px #ff9100;
    }

    @keyframes pulse-focus {
      0% {
        opacity: 0.4;
        transform: scale(0.8);
      }

      100% {
        opacity: 1;
        transform: scale(1.2);
      }
    }

    /* Focus reticle animation on camera click */
    .focus-reticle {
      position: absolute;
      width: 64px;
      height: 64px;
      border: 2px solid #00e5ff;
      border-radius: 12px;
      transform: translate(-50%, -50%) scale(1.5);
      opacity: 0;
      pointer-events: none;
      z-index: 55;
      transition: transform 0.25s ease-out, opacity 0.25s ease-out;
    }

    .focus-reticle.active {
      transform: translate(-50%, -50%) scale(1);
      opacity: 0.95;
    }

    .ar-overlay {
      position: absolute;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(15px);
      padding: 18px;
      border-radius: 24px;
      text-align: center;
      z-index: 20;
      pointer-events: auto;
    }

    .ar-title {
      font-size: 18px;
      font-weight: 700;
      color: #111;
      margin-bottom: 8px;
    }

    .ar-score {
      display: inline-block;
      background: #000;
      color: #00e5ff;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 14px;
    }

    #loading-data {
      text-align: center;
      padding: 50px 20px;
      color: #666;
      font-weight: 600;
      line-height: 1.6;
    }

    /* Handle kéo trên mobile */
    .mobile-sheet-handle {
      display: none;
    }

    /* ==================================================================== */
    /* RESPONSIVE DESIGN: TỐI ƯU TOÀN DIỆN CHO ĐIỆN THOẠI & TABLET          */
    /* ==================================================================== */

    /* 1. Màn hình Tablet & Laptop nhỏ (769px - 1100px) */
    @media (max-width: 1100px) and (min-width: 769px) {
      body {
        padding: 12px;
      }

      .duo-device {
        max-width: 100%;
        aspect-ratio: 16 / 10.5;
        border-radius: 36px;
      }

      .screen-left {
        flex: 0.85;
        padding: 20px 16px;
        border-radius: 30px 0 0 30px;
      }

      .screen-right {
        border-radius: 0 30px 30px 0;
      }

      .glass-card {
        padding: 12px;
      }

      .glass-img-wrap {
        width: 82px;
        height: 66px;
      }
    }

    /* 2. Màn hình Điện Thoại Di Động Dọc (Portrait <= 768px) */
    @media (max-width: 768px) {
      body {
        padding: 0;
        background: #000;
        align-items: stretch;
      }

      .duo-device {
        width: 100%;
        height: 100%;
        height: 100dvh;
        max-width: 100%;
        aspect-ratio: auto;
        border-radius: 0;
        padding: 0;
        gap: 0;
        box-shadow: none;
        flex-direction: column;
        background: #000;
        overflow: hidden;
      }

      /* CAMERA PHÍA TRÊN: Trải nghiệm như một chiếc gương soi selfie trực tiếp */
      .screen-right {
        order: 1;
        flex: 1.25;
        min-height: 260px;
        max-height: 56vh;
        width: 100%;
        border-radius: 0 0 24px 24px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
        z-index: 10;
      }

      /* DANH SÁCH KÍNH PHÍA DƯỚI: Bottom Sheet vuốt chọn tiện lợi 1 ngón tay */
      .screen-left {
        order: 2;
        flex: 1;
        min-height: 0;
        max-width: 100%;
        width: 100%;
        border-radius: 24px 24px 0 0;
        padding: 10px 14px 24px 14px;
        background: #F9F6EF;
        box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.25);
        z-index: 30;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-y: contain;
      }

      /* Thanh gạt bottom sheet handle trên mobile */
      .mobile-sheet-handle {
        display: block;
        width: 44px;
        height: 4px;
        background: rgba(0, 0, 0, 0.22);
        border-radius: 4px;
        margin: 0 auto 10px auto;
      }

      .shop-header-wrap {
        margin-bottom: 12px;
      }

      .shop-header {
        font-size: 17px;
      }

      .btn-studio, .btn-sync {
        padding: 6px 10px;
        font-size: 11px;
        border-radius: 10px;
        gap: 4px;
      }

      .btn-studio svg, .btn-sync svg {
        width: 12px;
        height: 12px;
      }

      /* Thẻ sản phẩm tối ưu gọn gàng cho điện thoại */
      .glass-card {
        padding: 10px 12px;
        margin-bottom: 10px;
        border-radius: 16px;
      }

      .card-top {
        gap: 12px;
        margin-bottom: 8px;
      }

      .glass-img-wrap {
        width: 72px;
        height: 58px;
        border-radius: 12px;
        padding: 5px;
      }

      .glass-info {
        padding-right: 48px;
      }

      .glass-info h3 {
        font-size: 14px;
        margin-bottom: 3px;
        line-height: 1.25;
      }

      .price-box {
        gap: 6px;
        margin-bottom: 3px;
      }

      .old-price {
        font-size: 11px;
      }

      .sale-price {
        font-size: 15px;
      }

      .specs {
        font-size: 11px;
      }

      .stock-badge {
        top: 10px;
        right: 10px;
        padding: 3px 8px;
        font-size: 10px;
        border-radius: 8px;
      }

      .btn-buy {
        padding: 8px 12px;
        font-size: 13px;
        border-radius: 10px;
        gap: 6px;
      }

      .btn-buy svg {
        width: 14px;
        height: 14px;
      }

      /* Tinh chỉnh HUD & Khóa nét trên Camera Mobile */
      .focus-badge {
        top: 10px;
        left: 10px;
        padding: 5px 10px;
        font-size: 11px;
        border-radius: 14px;
      }

      .focus-dot {
        width: 7px;
        height: 7px;
      }

      /* Khung ảnh gốc PiP góc phải thu gọn */
      .pip-original {
        top: 10px;
        right: 10px;
        width: 82px;
        height: 55px;
        border-radius: 12px;
        border-width: 1.5px;
      }

      .pip-original.expanded {
        width: 138px;
        height: 92px;
      }

      .pip-tag {
        font-size: 8px;
        padding: 2px 6px;
        bottom: 3px;
      }

      /* Bảng tên kính & Điểm hợp mặt nhỏ gọn không che cằm/mặt */
      .ar-overlay {
        bottom: 12px;
        width: calc(100% - 24px);
        padding: 8px 12px;
        border-radius: 16px;
      }

      .ar-title {
        font-size: 14px;
        margin-bottom: 3px;
      }

      .ar-score {
        padding: 4px 12px;
        font-size: 11px;
        border-radius: 14px;
      }
    }

    /* 3. Màn hình Điện Thoại Xoay Ngang (Landscape <= 900px) */
    @media (max-width: 900px) and (orientation: landscape) {
      body {
        padding: 0;
        background: #000;
      }

      .duo-device {
        width: 100%;
        height: 100%;
        height: 100dvh;
        max-width: 100%;
        aspect-ratio: auto;
        border-radius: 0;
        padding: 4px;
        gap: 4px;
        flex-direction: row;
        box-shadow: none;
      }

      .screen-left {
        order: 1;
        flex: 0.85;
        max-width: 320px;
        border-radius: 16px;
        padding: 12px 14px;
        margin-top: 0;
      }

      .screen-right {
        order: 2;
        flex: 1.35;
        max-height: none;
        border-radius: 16px;
      }

      .mobile-sheet-handle {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div class="duo-device">
    <div class="screen-left">
      <div class="mobile-sheet-handle"></div>
      <div class="shop-header-wrap">
        <div class="shop-header">Bộ Sưu Tập Kính</div>
        <div style="display: flex; gap: 8px;">
          <a href="studio.html" class="btn-studio" title="Mở Studio tự động tách nền gọng kính">
            <svg viewBox="0 0 24 24">
              <path
                d="M22 6h-3.38c-.46-1.74-2.04-3-3.92-3s-3.46 1.26-3.92 3H13.2c-.46-1.74-2.04-3-3.92-3S5.82 4.26 5.38 6H2v2h1.1c.42 4.45 4.15 8 8.7 8 2.05 0 3.93-.72 5.4-1.92 1.47 1.2 3.35 1.92 5.4 1.92 4.55 0 8.28-3.55 8.7-8H22V6zm-10 8c-3.31 0-6-2.69-6-6h6v6zm8 0c-3.31 0-6-2.69-6-6h6v6z" />
            </svg>
            <span>Studio AR</span>
          </a>
          <button id="btn-sync" class="btn-sync" onclick="fetchInventory(true)"
            title="Đồng bộ lại dữ liệu từ Google Sheets">
            <svg viewBox="0 0 24 24">
              <path
                d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z" />
            </svg>
            <span>Đồng bộ</span>
          </button>
        </div>
      </div>
      <div id="source-status"></div>
      <div id="product-list">
        <div id="loading-data">⏳ Đang kết nối Google Sheets...</div>
      </div>
    </div>

    <div class="screen-right" id="camera-screen" onclick="handleCameraClick(event)">
      <!-- Khung hình nhỏ ảnh gốc khi chưa đeo kính AR (Picture-in-Picture) -->
      <div class="pip-original" id="pip-original" onclick="togglePipZoom(event)" title="Ảnh gốc mộc từ Camera (Chưa đeo kính AR) - Bấm để phóng to/thu nhỏ">
        <div class="pip-tag">📷 Ảnh gốc</div>
        <canvas id="pip_canvas"></canvas>
      </div>

      <!-- Focus HUD -->
      <div class="focus-badge" id="focus-badge" title="Nhấp vào để lấy nét lại">
        <div class="focus-dot" id="focus-dot"></div>
        <span id="focus-label">Đang khởi tạo camera...</span>
      </div>

      <!-- Focus Reticle Box on Click -->
      <div class="focus-reticle" id="focus-reticle"></div>

      <video id="webcam" autoplay playsinline></video>
      <div class="canvas-container"><canvas id="output_canvas"></canvas></div>

      <div class="ar-overlay" onclick="event.stopPropagation()">
        <div class="ar-title" id="overlay-name">Đang tải...</div>
        <div class="ar-score" id="overlay-score">Đang quét AI...</div>
      </div>
    </div>
  </div>

  <script>
    // ID Google Sheets từ link bạn cung cấp:
    // https://docs.google.com/spreadsheets/d/1O1hFMsAcnC_jvHiryhvWskNBJC1klaigDHjfOlA4l8o/edit?gid=0#gid=0
    const SHEET_ID = "1O1hFMsAcnC_jvHiryhvWskNBJC1klaigDHjfOlA4l8o";
    const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=0`;

    // Tự động nhận diện & chuyển đổi mọi định dạng link chia sẻ từ Google Drive thành link ảnh trực tiếp
    function formatGoogleDriveUrl(url) {
      if (!url || typeof url !== 'string') return 'Rayban.png';
      url = url.trim();
      if (!url) return 'Rayban.png';

      // Kiểm tra các định dạng link Google Drive thông dụng:
      // - https://drive.google.com/file/d/FILE_ID/view?usp=sharing
      // - https://drive.google.com/open?id=FILE_ID
      // - https://drive.google.com/uc?id=FILE_ID
      const driveMatch = url.match(/(?:drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?id=)|lh3\.googleusercontent\.com\/d\/)([a-zA-Z0-9_-]{20,})/);
      if (driveMatch && driveMatch[1]) {
        const fileId = driveMatch[1];
        // Sử dụng CDN ảnh chất lượng cao của Google Drive
        return `https://lh3.googleusercontent.com/d/${fileId}`;
      }
      return url;
    }

    // Tự tính scale theo quy tắc: Kính có độ rộng lớn hơn thì scale nhỏ hơn theo tỉ lệ nghịch
    function getScaleFromSize(sizeStr, defaultScale = 1.20) {
      if (!sizeStr) return defaultScale;
      const match = sizeStr.match(/(\d+)[-\s/](\d+)/);
      if (match) {
        const lens = parseFloat(match[1]);
        const bridge = parseFloat(match[2]);
        if (lens > 0) {
          const totalWidth = (lens * 2) + bridge;
          const baseWidth = (55 * 2) + 16; // 126mm (Rayban 55-16 chuẩn = 1.26)
          return Math.round((1.26 * (baseWidth / totalWidth)) * 100) / 100;
        }
      }
      return defaultScale;
    }

    function fetchViaGvizJsonp(sheetId, gid = 0) {
      return new Promise((resolve, reject) => {
        const callbackName = 'gvizCallback_' + Math.floor(Math.random() * 1000000);
        const script = document.createElement('script');
        const timeout = setTimeout(() => {
          cleanup();
          reject(new Error("Quá thời gian chờ phản hồi từ Google Sheets"));
        }, 6000);

        function cleanup() {
          clearTimeout(timeout);
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        window[callbackName] = function (json) {
          cleanup();
          if (json && json.table && json.table.rows) {
            resolve(json.table);
          } else {
            reject(new Error("Dữ liệu bảng Google Sheets không hợp lệ"));
          }
        };

        script.src = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=responseHandler:${callbackName}&gid=${gid}`;
        script.onerror = () => {
          cleanup();
          reject(new Error("Không thể tải kịch bản từ Google Sheets"));
        };
        document.body.appendChild(script);
      });
    }

    function parseGvizTable(table) {
      const colMap = {};
      table.cols.forEach((col, idx) => {
        if (col && col.label) {
          colMap[col.label.trim().toLowerCase()] = idx;
        }
      });

      return table.rows.map((row, rIdx) => {
        function getVal(key) {
          const idx = colMap[key.toLowerCase()];
          if (idx !== undefined && row.c && row.c[idx]) {
            const cell = row.c[idx];
            if (cell.f !== undefined && cell.f !== null) return String(cell.f).trim();
            if (cell.v !== null && cell.v !== undefined) return String(cell.v).trim();
          }
          return '';
        }

        const rawSize = getVal('size') || '55-16';
        const rawScale = parseFloat(getVal('scale'));
        const calcScale = !isNaN(rawScale) && rawScale > 0 ? rawScale : getScaleFromSize(rawSize, 1.20);
        const rawOffset = parseFloat(getVal('offsetY'));
        const calcOffset = !isNaN(rawOffset) ? rawOffset : 0.08;

        const rawSrc = getVal('src');
        const rawPhoto = getVal('actualPhoto');

        return {
          id: String(getVal('id') || (rIdx + 1)),
          name: String(getVal('name') || 'Kính mắt'),
          oldPrice: String(getVal('oldPrice') || ''),
          salePrice: String(getVal('salePrice') || ''),
          src: formatGoogleDriveUrl(rawSrc || 'Rayban.png'),
          actualPhoto: formatGoogleDriveUrl(rawPhoto || rawSrc || 'Rayban.png'),
          size: rawSize,
          material: String(getVal('material') || 'Hợp kim'),
          type: String(getVal('type') || 'square'),
          scale: calcScale,
          offsetY: calcOffset,
          zaloLink: String(getVal('zaloLink') || 'https://zalo.me/'),
          stock: parseInt(getVal('stock')) || 0
        };
      }).filter(item => item.name && item.name.trim() !== '');
    }

    // Helper timeout cho fetch
    async function fetchWithTimeout(url, timeoutMs = 3500) {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const response = await fetch(url, { signal: controller.signal });
        clearTimeout(id);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.text();
      } catch (e) {
        clearTimeout(id);
        throw e;
      }
    }

    // Cơ chế nạp dữ liệu đa tầng (JSONP -> Direct Fetch -> Multi-proxy -> Cache -> Fallback Data)
    async function fetchCsvFromAllSources() {
      // 1. Tầng 1: Thử Direct Fetch qua gviz URL
      try {
        console.log("Đang thử tải trực tiếp CSV từ Google Sheets...");
        const text = await fetchWithTimeout(SHEET_URL, 4000);
        if (text && text.includes('name') && text.includes('salePrice')) {
          return { text, source: 'live' };
        }
      } catch (e) {
        console.warn("Direct fetch không khả dụng:", e.message);
      }

      // 2. Tầng 2: Fallback qua các proxy mở
      const proxies = [
        "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(SHEET_URL),
        "https://thingproxy.freeboard.io/fetch/" + SHEET_URL,
        "https://api.allorigins.win/raw?url=" + encodeURIComponent(SHEET_URL)
      ];

      for (const proxy of proxies) {
        try {
          console.log("Đang thử qua proxy:", proxy.substring(0, 38) + "...");
          const text = await fetchWithTimeout(proxy, 3000);
          if (text && text.includes('name') && text.includes('salePrice')) {
            return { text, source: 'proxy' };
          }
        } catch (err) {
          console.warn("Proxy không phản hồi:", err.message);
        }
      }

      // 3. Tầng 3: Lấy từ LocalStorage Cache
      try {
        const cached = localStorage.getItem('cached_glasses_data');
        if (cached) {
          const parsed = JSON.parse(cached);
          if (Array.isArray(parsed) && parsed.length > 0) {
            console.log("Đang dùng dữ liệu đã cache từ phiên trước.");
            return { data: parsed, source: 'cache' };
          }
        }
      } catch (e) {
        console.warn("Không đọc được cache:", e);
      }

      // 4. Tầng 4: Dữ liệu mặc định chuẩn
      console.log("Dùng bộ dữ liệu offline mặc định.");
      return { data: FALLBACK_GLASSES_DATA, source: 'fallback' };
    }

    // Khóa cố định tiêu cự sau khi camera đã lấy nét nét nhất
    async function lockFocus() {
      if (!videoTrack) return;
      try {
        const caps = (typeof videoTrack.getCapabilities === 'function') ? videoTrack.getCapabilities() : {};
        const settings = (typeof videoTrack.getSettings === 'function') ? videoTrack.getSettings() : {};

        console.log("Cấu hình phần cứng camera (Capabilities):", caps);

        if (caps.focusMode && Array.isArray(caps.focusMode)) {
          if (caps.focusMode.includes('manual')) {
            const adv = { focusMode: 'manual' };
            // Trong Chrome, manual focus yêu cầu truyền thêm giá trị focusDistance nếu phần cứng hỗ trợ
            if (caps.focusDistance) {
              adv.focusDistance = settings.focusDistance || caps.focusDistance.min;
            }
            try {
              await videoTrack.applyConstraints({ advanced: [adv] });
              isFocusLocked = true;
              updateFocusUI('locked', '🎯 Đã khóa nét (Motor dừng cố định)');
              console.log("Đã khóa tiêu cự cứng manual:", adv);
              return;
            } catch (err) {
              console.warn("Lỗi khi áp dụng manual focus:", err);
            }
          }
          if (caps.focusMode.includes('single-shot')) {
            try {
              await videoTrack.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] });
              isFocusLocked = true;
              updateFocusUI('locked', '🎯 Đã khóa nét (Single-shot)');
              return;
            } catch (err) {
              console.warn("Lỗi khi áp dụng single-shot focus:", err);
            }
          }
        }

        // Nếu webcam là dòng UVC không hỗ trợ can thiệp motor tiêu cự qua WebRTC API
        isFocusLocked = false;
        updateFocusUI('unsupported', '📷 Tiêu cự tự động (Webcam không hỗ trợ khóa web)');
      } catch (err) {
        console.warn("Không thể can thiệp tiêu cự camera:", err);
        updateFocusUI('unsupported', '📷 Tiêu cự tự động (Webcam không hỗ trợ khóa web)');
      }
    }

    // Kích hoạt lấy nét lại (Refocus) khi người dùng chạm vào màn hình camera
    async function triggerRefocus(e) {
      if (!videoTrack) return;

      if (e) {
        showFocusReticle(e);
      }

      const caps = (typeof videoTrack.getCapabilities === 'function') ? videoTrack.getCapabilities() : {};

      if (caps.focusMode && Array.isArray(caps.focusMode)) {
        updateFocusUI('focusing', '🟡 Đang lấy nét tối ưu...');
        clearTimeout(focusLockTimer);
        isFocusLocked = false;

        try {
          if (caps.focusMode.includes('continuous')) {
            await videoTrack.applyConstraints({
              advanced: [{ focusMode: 'continuous' }]
            });
          } else if (caps.focusMode.includes('single-shot')) {
            await videoTrack.applyConstraints({
              advanced: [{ focusMode: 'single-shot' }]
            });
          }
        } catch (err) {
          console.warn("Lỗi khi chuyển autofocus:", err);
        }

        // Sau 1.8 giây, khi camera đã lấy nét rõ nhất thì khóa nét lại ngay
        focusLockTimer = setTimeout(() => {
          lockFocus();
        }, 1800);
      } else {
        updateFocusUI('unsupported', '📷 Tiêu cự tự động (Webcam không hỗ trợ khóa web)');
      }
    }

    function showFocusReticle(e) {
      const reticle = document.getElementById('focus-reticle');
      const screenRight = document.getElementById('camera-screen');
      if (!reticle || !screenRight) return;

      const rect = screenRight.getBoundingClientRect();
      const x = e.clientX ? (e.clientX - rect.left) : (rect.width / 2);
      const y = e.clientY ? (e.clientY - rect.top) : (rect.height / 2);

      reticle.style.left = `${x}px`;
      reticle.style.top = `${y}px`;
      reticle.classList.add('active');

      setTimeout(() => {
        reticle.classList.remove('active');
      }, 800);
    }

            ? videoTrack.getCapabilities()
            : {};

          console.log("Cấu hình phần cứng camera (Capabilities):", focusCapabilities);

          if (focusCapabilities && focusCapabilities.focusMode && Array.isArray(focusCapabilities.focusMode)) {
            updateFocusUI('focusing', '🟡 Đang lấy nét chuẩn...');

            // Bật continuous để autofocus tìm điểm nét nhất
            if (focusCapabilities.focusMode.includes('continuous')) {
              videoTrack.applyConstraints({
                advanced: [{ focusMode: "continuous" }]
              }).catch(e => console.warn("Lỗi continuous focus ban đầu:", e));
            }

            // Sau 2 giây khi camera đã lấy nét cực đại, cố định lại ngay
            clearTimeout(focusLockTimer);
            focusLockTimer = setTimeout(() => {
              lockFocus();
            }, 2000);
          } else {
            // Webcam phần cứng tự động, không có API can thiệp
            updateFocusUI('unsupported', '📷 Tiêu cự tự động (Webcam không hỗ trợ khóa web)');
          }
        }
      } catch (err) {
        console.warn("Camera không hỗ trợ API focus:", err);
        updateFocusUI('unsupported', '📷 Tiêu cự tự động (Webcam không hỗ trợ khóa web)');
      }
    });

    function onResults(results) {
      try {
        if (!video || video.videoWidth === 0 || video.videoHeight === 0) return;

        // Chỉ cập nhật kích thước canvas khi thay đổi để tránh tái cấp phát GPU context liên tục
        if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (results.image) {
          ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);
        }

        // Vẽ khung hình nhỏ ảnh gốc mộc (Picture-in-Picture)
        const pipCanvas = document.getElementById('pip_canvas');
        if (pipCanvas && results.image) {
          if (pipCanvas.width !== video.videoWidth || pipCanvas.height !== video.videoHeight) {
            pipCanvas.width = video.videoWidth;
            pipCanvas.height = video.videoHeight;
          }
          const pipCtx = pipCanvas.getContext('2d');
          pipCtx.drawImage(results.image, 0, 0, pipCanvas.width, pipCanvas.height);
        }

        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0 && GLASSES_DATA.length > 0) {
          const landmarks = results.multiFaceLandmarks[0];
          const activeData = GLASSES_DATA[activeGlassIndex] || GLASSES_DATA[0];

          // Lấy ảnh kính hiện tại; nếu chưa tải xong hoặc lỗi thì dùng ảnh fallback
          let activeImg = preloadedImages[activeGlassIndex];
          if (!activeImg || !activeImg.complete || !activeImg.naturalWidth || activeImg.naturalWidth === 0) {
            activeImg = defaultGlassImg;
          }

          if (!activeImg || !activeImg.complete || !activeImg.naturalWidth || activeImg.naturalWidth === 0) {
            return;
          }

          const w = canvas.width, h = canvas.height;
          const nose = landmarks[168]; // Gốc sống mũi giữa 2 mắt
          const leftCheek = landmarks[234];
          const rightCheek = landmarks[454];
          const forehead = landmarks[10];
          const chin = landmarks[152];

          // Tọa độ tâm 2 mắt để tính góc nghiêng chuẩn xác, triệt tiêu rung giật
          const leftEyeCenter = {
            x: (landmarks[33].x + landmarks[133].x) * 0.5 * w,
            y: (landmarks[33].y + landmarks[133].y) * 0.5 * h
          };
          const rightEyeCenter = {
            x: (landmarks[263].x + landmarks[362].x) * 0.5 * w,
            y: (landmarks[263].y + landmarks[362].y) * 0.5 * h
          };

          // 1. GIẢI THUẬT XỬ LÝ GÓC NGHIÊNG ROLL (Nghiêng đầu trái/phải theo trục Z)
          // Kết hợp trục mắt (70%) và trục gò má (30%) để giữ ổn định góc ngay cả khi nháy mắt
          const dxEyes = rightEyeCenter.x - leftEyeCenter.x;
          const dyEyes = rightEyeCenter.y - leftEyeCenter.y;
          const angleEyes = Math.atan2(dyEyes, dxEyes);

          const dxCheeks = (rightCheek.x - leftCheek.x) * w;
          const dyCheeks = (rightCheek.y - leftCheek.y) * h;
          const angleCheeks = Math.atan2(dyCheeks, dxCheeks);

          const targetRoll = (angleEyes * 0.7) + (angleCheeks * 0.3);

          // 2. GIẢI THUẬT XỬ LÝ GÓC QUAY YAW (Quay mặt nhẹ sang trái / phải)
          const distToLeftCheek = Math.hypot((nose.x - leftCheek.x) * w, (nose.y - leftCheek.y) * h);
          const distToRightCheek = Math.hypot((rightCheek.x - nose.x) * w, (rightCheek.y - nose.y) * h);
          const yawAsymmetry = (distToRightCheek - distToLeftCheek) / ((distToRightCheek + distToLeftCheek) || 1);
          const targetYaw = Math.max(-0.55, Math.min(0.55, yawAsymmetry * 1.5));

          // 3. GIẢI THUẬT XỬ LÝ GÓC GẬT PITCH (Ngửa mặt / cúi mặt lên xuống)
          const faceHeightPx = Math.hypot((chin.x - forehead.x) * w, (chin.y - forehead.y) * h);
          const noseToForehead = Math.hypot((nose.x - forehead.x) * w, (nose.y - forehead.y) * h);
          const pitchRatio = noseToForehead / (faceHeightPx || 1);
          const targetPitch = Math.max(-0.45, Math.min(0.45, (pitchRatio - 0.38) * 2.2));

          // Kích thước mặt và kính
          const faceWidthPx = Math.hypot(dxCheeks, dyCheeks);
          const targetWidth = faceWidthPx * (activeData.scale || 1.26);

          // 4. BỘ LỌC CHỐNG RUNG (Adaptive Low-pass Filter / Exponential Moving Average)
          // Triệt tiêu hoàn toàn hiện tượng rung lắc kính khi camera autofocus hoặc nghiêng góc nhỏ
          const smoothFactor = 0.35;
          if (filterState.initialized) {
            let diffAngle = targetRoll - filterState.roll;
            while (diffAngle < -Math.PI) diffAngle += Math.PI * 2;
            while (diffAngle > Math.PI) diffAngle -= Math.PI * 2;
            filterState.roll += diffAngle * smoothFactor;

            filterState.x += (nose.x * w - filterState.x) * smoothFactor;
            filterState.y += (nose.y * h - filterState.y) * smoothFactor;
            filterState.width += (targetWidth - filterState.width) * smoothFactor;
            filterState.yaw += (targetYaw - filterState.yaw) * smoothFactor;
            filterState.pitch += (targetPitch - filterState.pitch) * smoothFactor;
          } else {
            filterState.roll = targetRoll;
            filterState.x = nose.x * w;
            filterState.y = nose.y * h;
            filterState.width = targetWidth;
            filterState.yaw = targetYaw;
            filterState.pitch = targetPitch;
            filterState.initialized = true;
          }

          // Tính điểm số hợp mặt
          scoreTimer++;
          if (scoreTimer > 40) {
            const faceRatio = faceHeightPx / (faceWidthPx || 1);
            currentScore = (faceRatio > 1.3) ? (activeData.type === 'square' ? 95 : 88) : (activeData.type === 'square' ? 92 : 78);
            currentScore += Math.floor(Math.random() * 5);
            const scoreEl = document.getElementById('overlay-score');
            if (scoreEl) scoreEl.innerText = `Độ hợp mặt: ${currentScore}%`;
            scoreTimer = 0;
          }

          const imgAspect = (activeImg.naturalHeight && activeImg.naturalWidth)
            ? (activeImg.naturalHeight / activeImg.naturalWidth)
            : 0.4;
          const targetHeight = filterState.width * imgAspect;

          // Độ lệch sống mũi được tính theo hệ tọa độ địa phương sau khi đã xoay góc nghiêng
          // Giúp kính luôn bám cố định trên sống mũi, không bị trượt lệch khi nghiêng đầu
          const localOffsetY = faceWidthPx * (activeData.offsetY !== undefined ? activeData.offsetY : 0.08);

          ctx.save();
          try {
            ctx.translate(filterState.x, filterState.y);
            ctx.rotate(filterState.roll);

            // Áp dụng biến dạng phối cảnh 3D khi nghiêng hoặc quay đầu góc nhỏ (Yaw & Pitch)
            const cosYaw = Math.cos(filterState.yaw);
            const sinYaw = Math.sin(filterState.yaw);
            const cosPitch = Math.cos(filterState.pitch);
            ctx.transform(cosYaw, 0, sinYaw * 0.12, cosPitch, 0, 0);

            ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
            ctx.shadowBlur = 14;
            ctx.shadowOffsetY = 12;

            ctx.drawImage(
              activeImg,
              -filterState.width / 2,
              -targetHeight / 2 + localOffsetY,
              filterState.width,
              targetHeight
            );
          } catch (drawErr) {
            console.warn("Lỗi vẽ kính lên canvas:", drawErr);
          } finally {
            ctx.restore();
          }
        }
      } catch (err) {
        console.warn("Lỗi xử lý frame AR trong onResults:", err);
      }
    }

    const faceMesh = new FaceMesh({
      locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`
    });
    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: false,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    faceMesh.onResults(onResults);

    // Chuẩn camera 1280x720 tương thích toàn bộ webcam laptop/máy tính & điện thoại (mặc định camera trước selfie)
    const camera = new Camera(video, {
      onFrame: async () => {
        try {
          if (video && !video.paused && !video.ended && video.readyState >= 2 && video.videoWidth > 0) {
            await faceMesh.send({ image: video });
          }
        } catch (frameErr) {
          console.warn("Lỗi gửi frame camera tới FaceMesh:", frameErr);
        }
      },
      width: 1280,
      height: 720,
      facingMode: 'user'
    });

    camera.start().catch(camErr => {
      console.error("Không thể khởi động camera:", camErr);
      const scoreEl = document.getElementById('overlay-score');
      if (scoreEl) scoreEl.innerText = "Lỗi quyền truy cập Camera!";
    });
  </script>
</body>
