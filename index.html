<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AR Kính Mắt - Quản Lý Kho Qua Google Sheets</title>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #d2d4d9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 20px;
      overflow: hidden;
    }

    .duo-device {
      display: flex;
      width: 100%;
      max-width: 1180px;
      aspect-ratio: 16 / 10.2;
      background: #1c1c1e;
      border-radius: 46px;
      padding: 8px;
      gap: 6px;
      box-shadow: inset 0 0 2px rgba(255, 255, 255, 0.4), 0 40px 60px -15px rgba(0, 0, 0, 0.4);
    }

    .screen-left {
      flex: 0.82;
      max-width: 440px;
      background: #F9F6EF;
      border-radius: 38px 0 0 38px;
      padding: 25px 20px;
      overflow-y: auto;
      position: relative;
    }

    .screen-left::-webkit-scrollbar {
      width: 6px;
    }

    .screen-left::-webkit-scrollbar-track {
      background: transparent;
    }

    .screen-left::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.15);
      border-radius: 10px;
    }

    .shop-header-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .shop-header {
      font-size: 24px;
      font-weight: 700;
      color: #1d1d1f;
      letter-spacing: -0.5px;
    }

    .btn-sync {
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 12px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
      color: #1d1d1f;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    .btn-sync:hover {
      background: #f0f0f2;
      transform: translateY(-1px);
    }

    .btn-sync svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
      transition: transform 0.5s ease;
    }

    .btn-sync.spinning svg {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    .btn-studio {
      background: linear-gradient(135deg, #0070F3 0%, #00C6FF 100%);
      color: #fff;
      text-decoration: none;
      border-radius: 12px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(0, 112, 243, 0.25);
    }

    .btn-studio:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 198, 255, 0.35);
    }

    .btn-studio svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .source-notice {
      background: rgba(0, 122, 255, 0.08);
      color: #0066cc;
      border: 1px solid rgba(0, 122, 255, 0.2);
      padding: 7px 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .source-notice.warning {
      background: rgba(255, 149, 0, 0.1);
      color: #c46800;
      border-color: rgba(255, 149, 0, 0.25);
    }

    .glass-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 16px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .glass-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    }

    .glass-card.active {
      border-color: #007aff;
      box-shadow: 0 8px 25px rgba(0, 122, 255, 0.15);
    }

    .stock-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
    }

    .stock-in {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .stock-out {
      background: #ffebee;
      color: #c62828;
    }

    .card-top {
      display: flex;
      gap: 15px;
      align-items: center;
      margin-bottom: 12px;
    }

    .glass-img-wrap {
      width: 100px;
      height: 80px;
      background: #F9F6EF;
      border-radius: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    .glass-img-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      mix-blend-mode: multiply;
    }

    .glass-info {
      flex: 1;
      padding-right: 60px;
    }

    .glass-info h3 {
      font-size: 16px;
      font-weight: 600;
      color: #1d1d1f;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .price-box {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 6px;
    }

    .old-price {
      font-size: 13px;
      color: #86868b;
      text-decoration: line-through;
      font-weight: 500;
    }

    .sale-price {
      font-size: 17px;
      color: #e53935;
      font-weight: 700;
    }

    .specs {
      font-size: 13px;
      color: #86868b;
    }

    .btn-buy {
      background: #0068FF;
      color: #fff;
      text-decoration: none;
      text-align: center;
      padding: 10px 15px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }

    .btn-buy:hover {
      background: #0055d4;
    }

    .btn-buy.disabled {
      background: #e0e0e0;
      color: #9e9e9e;
      pointer-events: none;
    }

    .btn-buy svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .screen-right {
      flex: 1.25;
      background: #000;
      border-radius: 0 38px 38px 0;
      position: relative;
      overflow: hidden;
      cursor: crosshair;
    }

    /* Khung hình nhỏ hiển thị camera gốc khi chưa đeo kính AR (Picture-in-Picture) */
    .pip-original {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 144px;
      height: 96px;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.45);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 15px rgba(0, 122, 255, 0.2);
      background: #000;
      z-index: 70;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .pip-original:hover {
      transform: scale(1.04);
      border-color: #00F0FF;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 240, 255, 0.4);
    }

    .pip-original.expanded {
      width: 230px;
      height: 153px;
      border-color: #00F0FF;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.9), 0 0 25px rgba(0, 240, 255, 0.45);
    }

    .pip-original canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      display: block;
    }

    .pip-tag {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 8px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 2;
      letter-spacing: 0.3px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    video {
      display: none;
    }

    /* ==================================================================== */
    /* FOCUS HUD (NÚM TRÒN TỐI GIẢN PHONG CÁCH IPHONE)                     */
    /* ==================================================================== */
    .focus-badge {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 60;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      transition: all 0.2s ease;
      user-select: none;
    }

    .focus-badge:active {
      transform: scale(0.90);
    }

    .focus-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #FF9F0A; /* Màu cam mặc định: Tự động lấy nét (Autofocus) */
      box-shadow: 0 0 10px #FF9F0A;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .focus-dot.locked {
      background: #30D158; /* Màu xanh lá iOS: Đã khóa tiêu cự thủ công (Manual Lock) */
      box-shadow: 0 0 12px #30D158;
    }

    .focus-dot.focusing {
      background: #FFD60A; /* Màu vàng: Đang lấy nét chuẩn */
      box-shadow: 0 0 12px #FFD60A;
      animation: pulse-focus 0.6s infinite alternate;
    }

    .focus-dot.unsupported {
      background: #FF9F0A; /* Màu cam: Camera tự động */
      box-shadow: 0 0 10px #FF9F0A;
    }

    @keyframes pulse-focus {
      0% { opacity: 0.4; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.25); }
    }

    /* Focus reticle animation on camera click */
    .focus-reticle {
      position: absolute;
      width: 60px;
      height: 60px;
      border: 2px solid #00F0FF;
      border-radius: 12px;
      transform: translate(-50%, -50%) scale(1.4);
      opacity: 0;
      pointer-events: none;
      z-index: 55;
      transition: transform 0.25s ease-out, opacity 0.25s ease-out;
    }

    .focus-reticle.active {
      transform: translate(-50%, -50%) scale(1);
      opacity: 0.95;
    }

    /* ==================================================================== */
    /* THANH FILTER LIVESTREAM VIỀN PHẢI (BEAUTY, BRIGHT, ROSY, SNAPSHOT)   */
    /* ==================================================================== */
    .camera-filters-bar {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 65;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .filter-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.35);
      transition: all 0.25s cubic-bezier(0.32, 0.72, 0, 1);
      user-select: none;
    }

    .filter-btn:active {
      transform: scale(0.90);
    }

    .filter-btn .filter-icon {
      font-size: 17px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .filter-btn .filter-icon svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
    }

    .filter-btn .filter-label {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: -0.2px;
      margin-top: 2px;
      opacity: 0.9;
    }

    .filter-btn.active {
      background: rgba(0, 240, 255, 0.25);
      border-color: #00F0FF;
      color: #00F0FF;
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.5);
      transform: scale(1.05);
    }

    .filter-btn.btn-snap {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.5);
    }

    .filter-btn.btn-snap:active {
      background: #fff;
      color: #000;
      transform: scale(0.88);
    }

    /* Hiệu ứng chớp sáng khi chụp ảnh */
    .camera-flash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      z-index: 999;
      pointer-events: none;
      animation: flash-anim 0.35s ease-out forwards;
    }

    @keyframes flash-anim {
      0% { opacity: 0.9; }
      100% { opacity: 0; }
    }

    /* ==================================================================== */
    /* APPLE LIQUID GLASS AI MATCH PILL (PHÂN TÍCH NHÂN TRẮC HỌC THỜI TRANG)*/
    /* ==================================================================== */
    .ai-match-pill {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 440px;
      background: rgba(18, 20, 28, 0.78);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 22px;
      padding: 9px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      z-index: 50;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45), 0 0 15px rgba(0, 240, 255, 0.12);
      transition: all 0.25s cubic-bezier(0.32, 0.72, 0, 1);
      user-select: none;
    }

    .ai-match-pill:hover {
      transform: translateX(-50%) translateY(-2px);
      border-color: rgba(0, 240, 255, 0.4);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6), 0 0 25px rgba(0, 240, 255, 0.25);
    }

    .ai-pill-icon {
      font-size: 20px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ai-pill-body {
      flex: 1;
      min-width: 0;
    }

    .ai-pill-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 2px;
    }

    .ai-shape-badge {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
    }

    .ai-score-badge {
      font-size: 11px;
      font-weight: 700;
      background: linear-gradient(135deg, #007AFF 0%, #00F0FF 100%);
      color: #fff;
      padding: 2px 8px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0, 122, 255, 0.35);
      white-space: nowrap;
    }

    .ai-pill-advice {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.82);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }

    .ai-pill-chevron {
      width: 14px;
      height: 14px;
      fill: rgba(255, 255, 255, 0.5);
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }

    .ai-match-pill:hover .ai-pill-chevron {
      transform: translateX(2px);
      fill: #00F0FF;
    }

    /* Modal Báo cáo phân tích AI Stylist chi tiết */
    .ai-modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .ai-modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .ai-modal-card {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 28px 28px 0 0;
      padding: 16px 20px 32px 20px;
      max-height: 82vh;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
      box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.4);
    }

    .ai-modal-backdrop.open .ai-modal-card {
      transform: translateY(0);
    }

    .modal-handle {
      width: 42px;
      height: 4px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 4px;
      margin: 0 auto 14px auto;
    }

    .ai-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }

    .ai-modal-title {
      font-size: 17px;
      font-weight: 700;
      color: #1d1d1f;
    }

    .ai-modal-subtitle {
      font-size: 11px;
      color: #86868b;
      margin-top: 2px;
    }

    .btn-close-modal {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #f0f0f2;
      border: none;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      transition: 0.2s;
    }

    .btn-close-modal:hover {
      background: #e4e4e6;
      color: #000;
    }

    .ai-report-box {
      background: #F9F6EF;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .ai-metric-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin: 12px 0;
    }

    .metric-card {
      background: #ffffff;
      border-radius: 14px;
      padding: 10px;
      text-align: center;
      border: 1px solid rgba(0, 0, 0, 0.06);
    }

    .metric-val {
      font-size: 16px;
      font-weight: 700;
      color: #007AFF;
    }

    .metric-name {
      font-size: 10px;
      color: #86868b;
      margin-top: 2px;
    }

    /* Toast thông báo */
    .toast-notification {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-35px);
      background: rgba(18, 20, 28, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #fff;
      padding: 8px 18px;
      border-radius: 22px;
      font-size: 12px;
      font-weight: 600;
      z-index: 99999;
      pointer-events: none;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.32, 0.72, 0, 1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      white-space: nowrap;
    }

    .toast-notification.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Thanh hành động nhanh trên Mobile */
    .mobile-quick-action {
      display: none;
    }

    #loading-data {
      text-align: center;
      padding: 50px 20px;
      color: #666;
      font-weight: 600;
      line-height: 1.6;
    }

    /* Handle kéo trên mobile */
    .mobile-sheet-handle {
      display: none;
    }

    /* ==================================================================== */
    /* RESPONSIVE DESIGN: TỐI ƯU TOÀN DIỆN CHO ĐIỆN THOẠI & TABLET          */
    /* ==================================================================== */

    /* 1. Màn hình Tablet & Laptop nhỏ (769px - 1100px) */
    @media (max-width: 1100px) and (min-width: 769px) {
      body {
        padding: 12px;
      }

      .duo-device {
        max-width: 100%;
        aspect-ratio: 16 / 10.5;
        border-radius: 36px;
      }

      .screen-left {
        flex: 0.85;
        padding: 20px 16px;
        border-radius: 30px 0 0 30px;
      }

      .screen-right {
        border-radius: 0 30px 30px 0;
      }

      .glass-card {
        padding: 12px;
      }

      .glass-img-wrap {
        width: 82px;
        height: 66px;
      }
    }

    /* 2. MÀN HÌNH ĐIỆN THOẠI DI ĐỘNG (Portrait <= 768px): CAMERA TỐI ĐA 74% */
    @media (max-width: 768px) {
      body {
        padding: 0;
        background: #000;
        align-items: stretch;
      }

      .duo-device {
        width: 100%;
        height: 100%;
        height: 100dvh;
        max-width: 100%;
        aspect-ratio: auto;
        border-radius: 0;
        padding: 0;
        gap: 0;
        box-shadow: none;
        flex-direction: column;
        background: #000;
        overflow: hidden;
        position: relative;
      }

      /* CAMERA PHÍA TRÊN: CHIẾM TỚI 73% MÀN HÌNH - RỘNG RÃI & SẮC NÉT */

    const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=0`;

    // Tự động nhận diện & chuyển đổi mọi định dạng link chia sẻ từ Google Drive thành link ảnh trực tiếp
    function formatGoogleDriveUrl(url) {
      if (!url || typeof url !== 'string') return 'Rayban.png';
      url = url.trim();
      if (!url) return 'Rayban.png';

      // Kiểm tra các định dạng link Google Drive thông dụng:
      // - https://drive.google.com/file/d/FILE_ID/view?usp=sharing
      // - https://drive.google.com/open?id=FILE_ID
      // - https://drive.google.com/uc?id=FILE_ID
      const driveMatch = url.match(/(?:drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?id=)|lh3\.googleusercontent\.com\/d\/)([a-zA-Z0-9_-]{20,})/);
      if (driveMatch && driveMatch[1]) {
        const fileId = driveMatch[1];
        // Sử dụng CDN ảnh chất lượng cao của Google Drive
        return `https://lh3.googleusercontent.com/d/${fileId}`;
      }
      return url;
    }

    // Tự tính scale theo quy tắc: Kính có độ rộng lớn hơn thì scale nhỏ hơn theo tỉ lệ nghịch
    function getScaleFromSize(sizeStr, defaultScale = 1.20) {
      if (!sizeStr) return defaultScale;
      const match = sizeStr.match(/(\d+)[-\s/](\d+)/);
      if (match) {
        const lens = parseFloat(match[1]);
        const bridge = parseFloat(match[2]);
        if (lens > 0) {
          const totalWidth = (lens * 2) + bridge;
          const baseWidth = (55 * 2) + 16; // 126mm (Rayban 55-16 chuẩn = 1.26)
          return Math.round((1.26 * (baseWidth / totalWidth)) * 100) / 100;
        }
      }
      return defaultScale;
    }

    // Đồng bộ Google Sheets siêu tốc bằng JSONP (hoạt động 100% không bị chặn CORS kể cả chạy file:///)
    function fetchViaGvizJsonp(sheetId, gid = 0) {

          clearTimeout(timeout);
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        window[callbackName] = function (json) {
          cleanup();
          if (json && json.table && json.table.rows) {
            resolve(json.table);
          } else {
            reject(new Error("Dữ liệu bảng Google Sheets không hợp lệ"));
          }
        };

        script.src = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=responseHandler:${callbackName}&gid=${gid}`;
        script.onerror = () => {
          cleanup();
          reject(new Error("Không thể tải kịch bản từ Google Sheets"));
        };
        document.body.appendChild(script);
      });
    }

    function parseGvizTable(table) {
      const colMap = {};
      table.cols.forEach((col, idx) => {
        if (col && col.label) {
          colMap[col.label.trim().toLowerCase()] = idx;
        }
      });

      return table.rows.map((row, rIdx) => {
        function getVal(key) {
          const idx = colMap[key.toLowerCase()];
          if (idx !== undefined && row.c && row.c[idx]) {
            const cell = row.c[idx];
            if (cell.f !== undefined && cell.f !== null) return String(cell.f).trim();
            if (cell.v !== null && cell.v !== undefined) return String(cell.v).trim();
          }
          return '';
        }

        const rawSize = getVal('size') || '55-16';
        const rawScale = parseFloat(getVal('scale'));
        const calcScale = !isNaN(rawScale) && rawScale > 0 ? rawScale : getScaleFromSize(rawSize, 1.20);
        const rawOffset = parseFloat(getVal('offsetY'));
        const calcOffset = !isNaN(rawOffset) ? rawOffset : 0.08;

        const rawSrc = getVal('src');
        const rawPhoto = getVal('actualPhoto');

        return {
          id: String(getVal('id') || (rIdx + 1)),
          name: String(getVal('name') || 'Kính mắt'),
          oldPrice: String(getVal('oldPrice') || ''),
          salePrice: String(getVal('salePrice') || ''),
          src: formatGoogleDriveUrl(rawSrc || 'Rayban.png'),
          actualPhoto: formatGoogleDriveUrl(rawPhoto || rawSrc || 'Rayban.png'),
          size: rawSize,
          material: String(getVal('material') || 'Hợp kim'),
          type: String(getVal('type') || 'square'),
          scale: calcScale,
          offsetY: calcOffset,
          zaloLink: String(getVal('zaloLink') || 'https://zalo.me/'),
          stock: parseInt(getVal('stock')) || 0
        };
      }).filter(item => item.name && item.name.trim() !== '');
    }

    // Helper timeout cho fetch
    async function fetchWithTimeout(url, timeoutMs = 3500) {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const response = await fetch(url, { signal: controller.signal });
        clearTimeout(id);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.text();
      } catch (e) {
        clearTimeout(id);
        throw e;
      }
    }

    // Cơ chế nạp dữ liệu đa tầng (JSONP -> Direct Fetch -> Multi-proxy -> Cache -> Fallback Data)
    async function fetchCsvFromAllSources() {
      // 1. Tầng 1: Thử Direct Fetch qua gviz URL
      try {
        console.log("Đang thử tải trực tiếp CSV từ Google Sheets...");
        const text = await fetchWithTimeout(SHEET_URL, 4000);
        if (text && text.includes('name') && text.includes('salePrice')) {
          return { text, source: 'live' };
        }
      } catch (e) {
        console.warn("Direct fetch không khả dụng:", e.message);
      }

      // 2. Tầng 2: Fallback qua các proxy mở
      const proxies = [
        "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(SHEET_URL),
        "https://thingproxy.freeboard.io/fetch/" + SHEET_URL,
        "https://api.allorigins.win/raw?url=" + encodeURIComponent(SHEET_URL)
      ];

      for (const proxy of proxies) {
        try {
          console.log("Đang thử qua proxy:", proxy.substring(0, 38) + "...");
          const text = await fetchWithTimeout(proxy, 3000);
          if (text && text.includes('name') && text.includes('salePrice')) {
            return { text, source: 'proxy' };
          }
        } catch (err) {
          console.warn("Proxy không phản hồi:", err.message);
        }
      }

      // 3. Tầng 3: Lấy từ LocalStorage Cache
      try {
        const cached = localStorage.getItem('cached_glasses_data');
        if (cached) {
          const parsed = JSON.parse(cached);
          if (Array.isArray(parsed) && parsed.length > 0) {
            console.log("Đang dùng dữ liệu đã cache từ phiên trước.");
            return { data: parsed, source: 'cache' };
          }
        }
      } catch (e) {
        console.warn("Không đọc được cache:", e);
      }

      // 4. Tầng 4: Dữ liệu mặc định chuẩn
      console.log("Dùng bộ dữ liệu offline mặc định.");
      return { data: FALLBACK_GLASSES_DATA, source: 'fallback' };
    }

    async function fetchInventory(isManualSync = false) {
      const btnSync = document.getElementById('btn-sync');
      if (btnSync) btnSync.classList.add('spinning');

      if (isManualSync) {
        productList.innerHTML = `<div id="loading-data">⏳ Đang kết nối và đồng bộ từ Google Sheets...</div>`;
      }

      try {
        // Ưu tiên 1: Đồng bộ trực tiếp qua Google Visualization JSONP (nhanh nhất, bypass CORS mọi môi trường)
        try {
          console.log("Đồng bộ Google Sheets ID:", SHEET_ID);
          const table = await fetchViaGvizJsonp(SHEET_ID, 0);
          const mapped = parseGvizTable(table);
          if (mapped && mapped.length > 0) {
            GLASSES_DATA = mapped;
            try { localStorage.setItem('cached_glasses_data', JSON.stringify(mapped)); } catch (e) { }
            showSourceNotice('live');
            renderProducts();
            selectGlass(0);
            return;
          }
        } catch (jsonpErr) {
          console.warn("JSONP thất bại, chuyển sang kênh fallback:", jsonpErr.message);
        }

        // Ưu tiên 2: Thử fetch CSV trực tiếp và qua proxy
        const result = await fetchCsvFromAllSources();

        if (result.text) {
          Papa.parse(result.text, {
            header: true,
            skipEmptyLines: true,
            complete: function (results) {
              const mapped = results.data
                .filter(row => row.name && row.name.trim() !== '')
                .map((row, rIdx) => {
                  const rawSize = row.size || '55-16';
                  const rawScale = parseFloat(row.scale);
                  const calcScale = !isNaN(rawScale) && rawScale > 0 ? rawScale : getScaleFromSize(rawSize, 1.20);
                  const rawOffset = parseFloat(row.offsetY);
                  const calcOffset = !isNaN(rawOffset) ? rawOffset : 0.08;

                  return {
                    id: row.id || String(rIdx + 1),
                    name: row.name,
                    oldPrice: row.oldPrice || "",
                    salePrice: row.salePrice || "",
                    src: formatGoogleDriveUrl(row.src || "Rayban.png"),
                    actualPhoto: formatGoogleDriveUrl(row.actualPhoto || row.src || "Rayban.png"),
                    size: rawSize,
                    material: row.material || "Hợp kim",
                    type: row.type || "square",
                    scale: calcScale,
                    offsetY: calcOffset,
                    zaloLink: row.zaloLink || "https://zalo.me/",
                    stock: parseInt(row.stock) || 0
                  };
                });

              if (mapped.length > 0) {
                GLASSES_DATA = mapped;
                try { localStorage.setItem('cached_glasses_data', JSON.stringify(mapped)); } catch (e) { }
                showSourceNotice(result.source);
                renderProducts();
                selectGlass(0);
              } else {
                applyFallbackData('Dữ liệu bảng tính trống');
              }
            },
            error: function (err) {
              console.error("Lỗi đọc CSV:", err);
              applyFallbackData('Lỗi phân tích cú pháp CSV');
            }
          });
        } else if (result.data) {
          GLASSES_DATA = result.data;
          showSourceNotice(result.source);
          renderProducts();
          selectGlass(0);
        }
      } catch (error) {
        console.error("Lỗi khi tải kho hàng:", error);
        applyFallbackData(error.message);
      } finally {
        if (btnSync) btnSync.classList.remove('spinning');
      }
    }

    // Chuẩn bị sẵn một ảnh fallback tiêu chuẩn (Rayban.png) để luôn sẵn sàng vẽ, không bao giờ để trống

      if (url.startsWith('http://') || url.startsWith('https://')) {
        img.crossOrigin = "anonymous";
      }

      img.onerror = () => {
        console.warn("Ảnh kính chưa tải được hoặc không tồn tại:", url, "-> Chuyển sang ảnh mẫu Rayban.png");
        img.removeAttribute('crossorigin');
        img.onerror = null; // Tránh lặp đệ quy nếu Rayban.png cũng bị lỗi
        img.src = 'Rayban.png';
      };

      img.src = url;
      return img;
    }

    // =========================================================================
    // THUẬT TOÁN AI ĐÁNH GIÁ DÁNG KHUÔN MẶT & ĐỘ HỢP KÍNH (OPTICAL STYLING AI)
    // Dựa trên 468 điểm mốc nhân trắc học khuôn mặt từ MediaPipe FaceMesh
    // =========================================================================
    let currentAiAnalysis = null;
    let cachedLandmarks = null;

    function analyzeFaceAndEyewearMatch(landmarks, w, h, activeData) {
      if (!landmarks || landmarks.length < 468) return null;

      // 1. TỌA ĐỘ CÁC ĐIỂM MỐC ANATOMICAL LANDMARKS (Theo chuẩn nhân trắc học quốc tế)
      const pForehead = { x: landmarks[10].x * w, y: landmarks[10].y * h };       // Đỉnh trán (Trichion)
      const pChin = { x: landmarks[152].x * w, y: landmarks[152].y * h };           // Điểm cằm (Menton)
      const pLeftCheek = { x: landmarks[234].x * w, y: landmarks[234].y * h };      // Gò má trái (Zygion Left)
      const pRightCheek = { x: landmarks[454].x * w, y: landmarks[454].y * h };    // Gò má phải (Zygion Right)
      const pLeftJaw = { x: landmarks[172].x * w, y: landmarks[172].y * h };        // Góc hàm trái (Gonion Left)
      const pRightJaw = { x: landmarks[397].x * w, y: landmarks[397].y * h };      // Góc hàm phải (Gonion Right)
      const pLeftForehead = { x: landmarks[103].x * w, y: landmarks[103].y * h };  // Thái dương trái
      const pRightForehead = { x: landmarks[332].x * w, y: landmarks[332].y * h };// Thái dương phải

      // 2. TÍNH TOÁN CÁC KÍCH THƯỚC HÌNH HỌC (Pixel metrics)
      const faceHeight = Math.hypot(pChin.x - pForehead.x, pChin.y - pForehead.y);
      const faceWidth = Math.hypot(pRightCheek.x - pLeftCheek.x, pRightCheek.y - pLeftCheek.y);
      const jawWidth = Math.hypot(pRightJaw.x - pLeftJaw.x, pRightJaw.y - pLeftJaw.y);
      const foreheadWidth = Math.hypot(pRightForehead.x - pLeftForehead.x, pRightForehead.y - pLeftForehead.y);

      if (faceWidth === 0 || faceHeight === 0) return null;

      // 3. TÍNH TỈ LỆ NHÂN TRẮC HỌC (Anthropometric Facial Ratios)
      const ratioHW = faceHeight / faceWidth;           // Tỉ lệ Dài / Rộng (Chuẩn vàng: 1.30 - 1.40)
      const ratioJaw = jawWidth / faceWidth;            // Tỉ lệ Xương hàm / Gò má
      const ratioForehead = foreheadWidth / faceWidth;  // Tỉ lệ Trán / Gò má

      // 4. PHÂN LOẠI DÁNG KHUÔN MẶT CHÍNH XÁC (Face Shape Classification)
      let shapeKey = 'oval';
      let shapeName = 'Mặt Trái Xoan';
      let shapeIcon = '✨';
      let shapeTrait = 'Tỉ lệ chuẩn thời trang quốc tế';

      if (ratioHW < 1.25 && ratioJaw < 0.77) {
        shapeKey = 'round';
        shapeName = 'Mặt Tròn';
        shapeIcon = '🟡';
        shapeTrait = 'Đường nét mềm mại, gò má đầy đặn';
      } else if (ratioHW < 1.28 && ratioJaw >= 0.77) {
        shapeKey = 'square';
        shapeName = 'Mặt Vuông';
        shapeIcon = '🟦';
        shapeTrait = 'Quai hàm sắc sảo, góc cạnh nam tính';
      } else if (ratioHW > 1.44) {
        shapeKey = 'oblong';
        shapeName = 'Mặt Dài';
        shapeIcon = '📏';
        shapeTrait = 'Chiều dài thanh thoát, vầng trán cao';
      } else if (ratioForehead > ratioJaw * 1.20 && ratioJaw < 0.72) {
        shapeKey = 'heart';
        shapeName = 'Mặt Trái Tim (V-Line)';
        shapeIcon = '💖';
        shapeTrait = 'Trán rộng thanh tú, cằm V-line thon gọn';
      } else if (faceWidth > foreheadWidth * 1.16 && faceWidth > jawWidth * 1.16) {
        shapeKey = 'diamond';
        shapeName = 'Mặt Kim Cương';
        shapeIcon = '💎';
        shapeTrait = 'Gò má cao ấn tượng, cằm và trán thon';
      } else {
        shapeKey = 'oval';
        shapeName = 'Mặt Trái Xoan';
        shapeIcon = '✨';
        shapeTrait = 'Tỉ lệ vàng cân đối hoàn hảo';
      }

      // 5. MA TRẬN PHÙ HỢP QUANG HỌC THỜI TRANG (Optical Styling Compatibility Matrix)
      // Dựa trên quy tắc đối nghịch (Contrast Rule) và quy tắc cân bằng thị giác của Stylist:
      const glassType = (activeData.type || 'square').toLowerCase();
      let matchScore = 88;
      let matchTitle = 'Rất hợp khuôn mặt';
      let styleAdvice = '';

      switch (shapeKey) {
        case 'round': // Mặt Tròn -> Cần gọng góc cạnh, vuông, chữ nhật
          if (glassType === 'square' || glassType === 'rectangle') {
            matchScore = 97;
            matchTitle = 'Tuyệt phẩm tôn dáng!';
            styleAdvice = 'Gọng vuông tạo đường nét sắc sảo, giúp gương mặt thon gọn hơn 15%.';
          } else if (glassType === 'aviator') {
            matchScore = 89;
            matchTitle = 'Rất hài hòa & cá tính';
            styleAdvice = 'Dáng phi công kéo dài khuôn mặt tự nhiên, tôn sống mũi cao.';
          } else if (glassType === 'oval') {
            matchScore = 82;
            matchTitle = 'Hài hòa nhẹ nhàng';
            styleAdvice = 'Dáng oval êm dịu nhưng nên ưu tiên gọng có góc viền trên.';
          } else { // round
            matchScore = 72;
            matchTitle = 'Hơi trùng nét tròn';
            styleAdvice = 'Kính tròn lặp lại đường cong mặt; nên thử gọng vuông để tạo điểm nhấn.';
          }
          break;

        case 'square': // Mặt Vuông -> Cần gọng tròn, oval, giọt nước làm mềm
          if (glassType === 'round' || glassType === 'oval') {
            matchScore = 98;
            matchTitle = 'Đỉnh cao cân bằng!';
            styleAdvice = 'Đường cong mềm mại làm dịu quai hàm góc cạnh, tôn vẻ thanh lịch.';
          } else if (glassType === 'aviator') {
            matchScore = 94;
            matchTitle = 'Cực kỳ phong trần';
            styleAdvice = 'Dáng giọt nước cân đối hoàn hảo với xương hàm vuông vức.';
          } else { // square
            matchScore = 75;
            matchTitle = 'Cá tính mạnh mẽ';
            styleAdvice = 'Gọng vuông làm gương mặt góc cạnh hơn; hợp phong cách ấn tượng.';
          }
          break;

        case 'oval': // Mặt Trái Xoan -> Hợp gần như mọi dáng kính
          if (glassType === 'square' || glassType === 'aviator') {
            matchScore = 98;
            matchTitle = 'Chuẩn tỉ lệ vàng!';
            styleAdvice = 'Tôn trọn vẹn nét thanh tú, toát lên phong thái sang trọng.';
          } else if (glassType === 'round') {
            matchScore = 94;
            matchTitle = 'Rất trẻ trung & hiện đại';
            styleAdvice = 'Tạo vẻ đẹp trí thức, phóng khoáng và cuốn hút.';
          } else {
            matchScore = 92;
            matchTitle = 'Rất đẹp & thời thượng';
            styleAdvice = 'Khuôn mặt trái xoan tự nhiên có thể diện đẹp mọi thiết kế.';
          }
          break;

        case 'oblong': // Mặt Dài -> Cần gọng to bản, gọng tròn, gọng có viền dày
          if (glassType === 'round' || glassType === 'oval' || glassType === 'aviator') {
            matchScore = 96;
            matchTitle = 'Thu ngắn chiều dài mặt';
            styleAdvice = 'Gọng tròn bản to giúp gương mặt đầy đặn và cân đối thị giác hơn.';
          } else if (glassType === 'square') {
            matchScore = 90;
            matchTitle = 'Cân đối thanh lịch';
            styleAdvice = 'Nên chọn gọng vuông có chiều cao tròng lớn để tôn khuôn mặt.';
          } else {
            matchScore = 84;
            matchTitle = 'Khá hài hòa';
            styleAdvice = 'Ưu tiên gọng to bản để tăng bề ngang cho khuôn mặt.';
          }
          break;

        case 'heart': // Mặt Trái Tim -> Cần gọng phi công, gọng oval, gọng mỏng đáy rộng
          if (glassType === 'aviator' || glassType === 'oval') {
            matchScore = 97;
            matchTitle = 'Tôn cằm V-line!';
            styleAdvice = 'Đáy kính nở rộng giúp cân bằng vùng trán và cằm nhọn cực duyên.';
          } else if (glassType === 'round') {
            matchScore = 92;
            matchTitle = 'Nhẹ nhàng thanh thoát';
            styleAdvice = 'Làm dịu vầng trán rộng, tạo cảm giác dễ gần đáng yêu.';
          } else {
            matchScore = 85;
            matchTitle = 'Cá tính hiện đại';
            styleAdvice = 'Nên ưu tiên gọng mảnh sáng màu để không làm nặng phần trán.';
          }
          break;

        case 'diamond': // Mặt Kim Cương -> Gọng oval, gọng mắt mèo, gọng tròn
          if (glassType === 'oval' || glassType === 'round') {
            matchScore = 96;
            matchTitle = 'Làm mềm gò má cao';
            styleAdvice = 'Đường cong kính ôm khéo léo gò má, tôn vẻ đẹp sang quý.';
          } else if (glassType === 'aviator') {
            matchScore = 91;
            matchTitle = 'Rất cuốn hút';
            styleAdvice = 'Gọng phi công giúp mở rộng vùng trán và cằm cân đối hơn.';
          } else {
            matchScore = 83;
            matchTitle = 'Sắc sảo ấn tượng';
            styleAdvice = 'Nên chọn gọng không quá góc cạnh để gò má thanh thoát.';
          }
          break;
      }

      return {
        shapeKey,
        shapeName,
        shapeIcon,
        shapeTrait,
        ratioHW: ratioHW.toFixed(2),
        ratioJaw: ratioJaw.toFixed(2),
        ratioForehead: ratioForehead.toFixed(2),
        matchScore,
        matchTitle,
        styleAdvice,
        glassName: activeData.name || 'Kính mắt'
      };
    }

    function renderAiPill(analysis) {

    function triggerAiEvaluation() {

    // ==========================================
    // CAMERA & MEDIAPIPE FACE MESH & KHÓA NÉT
    // ==========================================
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('output_canvas');
    const ctx = canvas.getContext('2d');
    let scoreTimer = 0;

    let videoTrack = null;
    let focusCapabilities = null;
    let focusLockTimer = null;
    let isFocusLocked = false;

    // Cập nhật biểu tượng núm tròn tối giản (không dùng chữ hiển thị)
    function updateFocusUI(status, labelText) {
      const dot = document.getElementById('focus-dot');
      const badge = document.getElementById('focus-badge');
      if (dot) {
        dot.className = 'focus-dot ' + status;
      }
      if (badge && labelText) {
        badge.title = labelText;
      }
    }

    // Bộ lọc chống rung & thích ứng triệt tiêu độ trễ
    const filterState = {
      initialized: false,
      x: 0,
      y: 0,
      width: 0,
      roll: 0,
      yaw: 0,
      pitch: 0
    };

    function togglePipZoom(e) {
      if (e) e.stopPropagation();
      const pip = document.getElementById('pip-original');
      if (pip) pip.classList.toggle('expanded');
    }

    // Khóa cố định tiêu cự sau khi camera đã lấy nét nét nhất
    async function lockFocus() {
      if (!videoTrack) return;
      try {
        const caps = (typeof videoTrack.getCapabilities === 'function') ? videoTrack.getCapabilities() : {};
        const settings = (typeof videoTrack.getSettings === 'function') ? videoTrack.getSettings() : {};

        console.log("Cấu hình phần cứng camera (Capabilities):", caps);

        if (caps.focusMode && Array.isArray(caps.focusMode)) {
          if (caps.focusMode.includes('manual')) {
            const adv = { focusMode: 'manual' };
            if (caps.focusDistance) {
              adv.focusDistance = settings.focusDistance || caps.focusDistance.min;
            }
            try {
              await videoTrack.applyConstraints({ advanced: [adv] });
              isFocusLocked = true;
              updateFocusUI('locked', '🎯 Đã khóa nét cố định (Xanh lá)');
              console.log("Đã khóa tiêu cự cứng manual:", adv);
              return;
            } catch (err) {
              console.warn("Lỗi khi áp dụng manual focus:", err);
            }
          }
          if (caps.focusMode.includes('single-shot')) {
            try {
              await videoTrack.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] });
              isFocusLocked = true;
              updateFocusUI('locked', '🎯 Đã khóa nét (Single-shot)');
              return;
            } catch (err) {
              console.warn("Lỗi khi áp dụng single-shot focus:", err);
            }
          }
        }

        isFocusLocked = false;
        updateFocusUI('unsupported', '📷 Tiêu cự tự động (Màu cam)');
      } catch (err) {
        console.warn("Không thể can thiệp tiêu cự camera:", err);
        updateFocusUI('unsupported', '📷 Tiêu cự tự động (Màu cam)');
      }
    }

    // Kích hoạt lấy nét lại (Refocus) khi người dùng chạm vào màn hình camera
    async function triggerRefocus(e) {
      if (!videoTrack) return;

      if (e) {
        showFocusReticle(e);
      }

      const caps = (typeof videoTrack.getCapabilities === 'function') ? videoTrack.getCapabilities() : {};

      if (caps.focusMode && Array.isArray(caps.focusMode)) {
        updateFocusUI('focusing', '🟡 Đang lấy nét tối ưu (Vàng nhấp nháy)...');
        clearTimeout(focusLockTimer);
        isFocusLocked = false;

        try {
          if (caps.focusMode.includes('continuous')) {
            await videoTrack.applyConstraints({
              advanced: [{ focusMode: 'continuous' }]
            });
          } else if (caps.focusMode.includes('single-shot')) {
            await videoTrack.applyConstraints({
              advanced: [{ focusMode: 'single-shot' }]
            });
          }
        } catch (err) {
          console.warn("Lỗi khi chuyển autofocus:", err);
        }

        // Sau 1.8 giây khi camera đã lấy nét rõ nhất thì khóa nét lại ngay
        focusLockTimer = setTimeout(() => {
          lockFocus();
        }, 1800);
      } else {
        updateFocusUI('unsupported', '📷 Tiêu cự tự động (Màu cam)');
      }
    }

    function showFocusReticle(e) {
      const reticle = document.getElementById('focus-reticle');
      const screenRight = document.getElementById('camera-screen');
      if (!reticle || !screenRight) return;

      const rect = screenRight.getBoundingClientRect();
      const x = e.clientX ? (e.clientX - rect.left) : (rect.width / 2);
      const y = e.clientY ? (e.clientY - rect.top) : (rect.height / 2);

      reticle.style.left = `${x}px`;
      reticle.style.top = `${y}px`;
      reticle.classList.add('active');

      setTimeout(() => {
        reticle.classList.remove('active');
      }, 800);
    }

    function handleCameraClick(e) {
      if (e.target.closest('.ai-match-pill') || e.target.closest('.pip-original') || e.target.closest('.camera-filters-bar')) return;
      triggerRefocus(e);
    }

    // Lắng nghe video khởi chạy để thiết lập autofocus ban đầu rồi khóa lại
    video.addEventListener('playing', () => {
      try {
        const stream = video.srcObject;
        if (stream) {
          videoTrack = stream.getVideoTracks()[0];
          focusCapabilities = (videoTrack && typeof videoTrack.getCapabilities === 'function')
            ? videoTrack.getCapabilities()
            : {};

          console.log("Cấu hình phần cứng camera (Capabilities):", focusCapabilities);

          if (focusCapabilities && focusCapabilities.focusMode && Array.isArray(focusCapabilities.focusMode)) {
            updateFocusUI('focusing', '🟡 Đang lấy nét chuẩn...');

            if (focusCapabilities.focusMode.includes('continuous')) {
              videoTrack.applyConstraints({
                advanced: [{ focusMode: "continuous" }]
              }).catch(e => console.warn("Lỗi continuous focus ban đầu:", e));
            }

            clearTimeout(focusLockTimer);
            focusLockTimer = setTimeout(() => {
              lockFocus();
            }, 2000);
          } else {
            updateFocusUI('unsupported', '📷 Tiêu cự tự động');
          }
        }
      } catch (err) {
        console.warn("Camera không hỗ trợ API focus:", err);
        updateFocusUI('unsupported', '📷 Tiêu cự tự động');
      }
    });

    // =========================================================================
    // XỬ LÝ FRAME MEDIAPIPE FACE MESH & VẼ KÍNH AR (TRIỆT TIÊU ĐỘ TRỄ 100%)
    // =========================================================================
    function onResults(results) {
      try {
        if (!video || video.videoWidth === 0 || video.videoHeight === 0) return;

        if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // ÁP DỤNG BỘ LỌC HIỆU ỨNG LIVESTREAM (LÀM MỊN DA, TĂNG SÁNG, TRẮNG HỒNG)
        if (results.image) {
          let filterStr = '';
          if (activeFilters.bright) filterStr += 'brightness(1.18) contrast(1.05) ';
          if (activeFilters.rosy) filterStr += 'saturate(1.25) hue-rotate(-8deg) brightness(1.06) ';

          ctx.filter = filterStr.trim() || 'none';
          ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

          // Hiệu ứng làm mịn da thông minh (Skin Softening Glow Blend)
          if (activeFilters.beauty) {
            ctx.save();
            ctx.globalAlpha = 0.35;
            ctx.filter = 'blur(6px) brightness(1.06)';
            ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);
            ctx.restore();
          }

          // Reset filter về none trước khi vẽ kính để gọng kính và tròng luôn nét 100%!
          ctx.filter = 'none';
        }

        // Khung hình nhỏ ảnh gốc mộc (Picture-in-Picture)
        const pipCanvas = document.getElementById('pip_canvas');
        if (pipCanvas && results.image) {
          if (pipCanvas.width !== video.videoWidth || pipCanvas.height !== video.videoHeight) {
            pipCanvas.width = video.videoWidth;
            pipCanvas.height = video.videoHeight;
          }
          const pipCtx = pipCanvas.getContext('2d');
          pipCtx.drawImage(results.image, 0, 0, pipCanvas.width, pipCanvas.height);
        }

        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0 && GLASSES_DATA.length > 0) {
          const landmarks = results.multiFaceLandmarks[0];
          cachedLandmarks = landmarks;
          const activeData = GLASSES_DATA[activeGlassIndex] || GLASSES_DATA[0];

          let activeImg = preloadedImages[activeGlassIndex];
          if (!activeImg || !activeImg.complete || !activeImg.naturalWidth || activeImg.naturalWidth === 0) {
            activeImg = defaultGlassImg;
          }

          if (!activeImg || !activeImg.complete || !activeImg.naturalWidth || activeImg.naturalWidth === 0) {
            return;
          }

          const w = canvas.width, h = canvas.height;
          const nose = landmarks[168]; // Gốc sống mũi giữa 2 mắt
          const leftCheek = landmarks[234];
          const rightCheek = landmarks[454];
          const forehead = landmarks[10];
          const chin = landmarks[152];

          const leftEyeCenter = {
            x: (landmarks[33].x + landmarks[133].x) * 0.5 * w,
            y: (landmarks[33].y + landmarks[133].y) * 0.5 * h
          };
          const rightEyeCenter = {
            x: (landmarks[263].x + landmarks[362].x) * 0.5 * w,
            y: (landmarks[263].y + landmarks[362].y) * 0.5 * h
          };

          // 1. GIẢI THUẬT XỬ LÝ GÓC NGHIÊNG ROLL (Nghiêng đầu trái/phải theo trục Z)
          const dxEyes = rightEyeCenter.x - leftEyeCenter.x;
          const dyEyes = rightEyeCenter.y - leftEyeCenter.y;
          const angleEyes = Math.atan2(dyEyes, dxEyes);

          const dxCheeks = (rightCheek.x - leftCheek.x) * w;
          const dyCheeks = (rightCheek.y - leftCheek.y) * h;
          const angleCheeks = Math.atan2(dyCheeks, dxCheeks);

          const targetRoll = (angleEyes * 0.7) + (angleCheeks * 0.3);

          // 2. GIẢI THUẬT XỬ LÝ GÓC QUAY YAW (Quay mặt sang trái / phải)
          const distToLeftCheek = Math.hypot((nose.x - leftCheek.x) * w, (nose.y - leftCheek.y) * h);
          const distToRightCheek = Math.hypot((rightCheek.x - nose.x) * w, (rightCheek.y - nose.y) * h);
          const yawAsymmetry = (distToRightCheek - distToLeftCheek) / ((distToRightCheek + distToLeftCheek) || 1);
          const targetYaw = Math.max(-0.55, Math.min(0.55, yawAsymmetry * 1.5));

          // 3. GIẢI THUẬT XỬ LÝ GÓC GẬT PITCH (Ngửa / cúi mặt)
          const faceHeightPx = Math.hypot((chin.x - forehead.x) * w, (chin.y - forehead.y) * h);
          const noseToForehead = Math.hypot((nose.x - forehead.x) * w, (nose.y - forehead.y) * h);
          const pitchRatio = noseToForehead / (faceHeightPx || 1);
          const targetPitch = Math.max(-0.45, Math.min(0.45, (pitchRatio - 0.38) * 2.2));

          // Kích thước mặt và kính
          const faceWidthPx = Math.hypot(dxCheeks, dyCheeks);
          const targetWidth = faceWidthPx * (activeData.scale || 1.26);

          // 4. BỘ LỌC ĐỘNG THÍCH ỨNG TRIỆT TIÊU 100% ĐỘ TRỄ (Adaptive Dynamic Filter)
          // - Khi quay đầu / di chuyển nhanh: Tăng factor lên 0.95 để kính bám chặt khuôn mặt tức thì, không bị trễ
          // - Khi đứng yên / nhìn thẳng: Giảm factor về 0.52 để triệt tiêu rung giật vi sai camera
          if (filterState.initialized) {
            const deltaMove = Math.hypot(nose.x * w - filterState.x, nose.y * h - filterState.y);
            const moveSpeedFactor = Math.min(1, Math.max(0, (deltaMove - 1.5) / 14));
            const dynamicPosFactor = 0.52 + 0.43 * moveSpeedFactor; // Dao động từ 0.52 đến 0.95

            let diffAngle = targetRoll - filterState.roll;
            while (diffAngle < -Math.PI) diffAngle += Math.PI * 2;
            while (diffAngle > Math.PI) diffAngle -= Math.PI * 2;
            const angleSpeedFactor = Math.min(1, Math.abs(diffAngle) / 0.08);
            const dynamicAngleFactor = 0.55 + 0.40 * angleSpeedFactor; // Dao động từ 0.55 đến 0.95

            filterState.roll += diffAngle * dynamicAngleFactor;
            filterState.x += (nose.x * w - filterState.x) * dynamicPosFactor;
            filterState.y += (nose.y * h - filterState.y) * dynamicPosFactor;
            filterState.width += (targetWidth - filterState.width) * dynamicPosFactor;
            filterState.yaw += (targetYaw - filterState.yaw) * dynamicPosFactor;
            filterState.pitch += (targetPitch - filterState.pitch) * dynamicPosFactor;
          } else {
            filterState.roll = targetRoll;
            filterState.x = nose.x * w;
            filterState.y = nose.y * h;
            filterState.width = targetWidth;
            filterState.yaw = targetYaw;
            filterState.pitch = targetPitch;
            filterState.initialized = true;
          }

          // 5. THỰC THI THUẬT TOÁN ĐÁNH GIÁ NHÂN TRẮC HỌC VÀ ĐỘ HỢP THỜI TRANG ĐỊNH KỲ
          scoreTimer++;
          if (scoreTimer > 25) {
            const analysis = analyzeFaceAndEyewearMatch(landmarks, w, h, activeData);
            if (analysis) {
              currentAiAnalysis = analysis;
              renderAiPill(analysis);
            }
            scoreTimer = 0;
          }

          const imgAspect = (activeImg.naturalHeight && activeImg.naturalWidth)
            ? (activeImg.naturalHeight / activeImg.naturalWidth)
            : 0.4;
          const targetHeight = filterState.width * imgAspect;
          const localOffsetY = faceWidthPx * (activeData.offsetY !== undefined ? activeData.offsetY : 0.08);

          ctx.save();
          try {
            ctx.translate(filterState.x, filterState.y);
            ctx.rotate(filterState.roll);

            const cosYaw = Math.cos(filterState.yaw);
            const sinYaw = Math.sin(filterState.yaw);
            const cosPitch = Math.cos(filterState.pitch);
            ctx.transform(cosYaw, 0, sinYaw * 0.12, cosPitch, 0, 0);

            ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
            ctx.shadowBlur = 14;
            ctx.shadowOffsetY = 12;

            ctx.drawImage(
              activeImg,
              -filterState.width / 2,
              -targetHeight / 2 + localOffsetY,
              filterState.width,
              targetHeight
            );
          } catch (drawErr) {
            console.warn("Lỗi vẽ kính lên canvas:", drawErr);
          } finally {
            ctx.restore();
          }
        }
      } catch (err) {
        console.warn("Lỗi xử lý frame AR trong onResults:", err);
      }
    }

    const faceMesh = new FaceMesh({
      locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`
    });
    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: false,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    faceMesh.onResults(onResults);

    // Chuẩn camera 1280x720 tương thích toàn bộ webcam laptop/máy tính & điện thoại (mặc định camera trước selfie)
    const camera = new Camera(video, {
      onFrame: async () => {
        try {
          if (video && !video.paused && !video.ended && video.readyState >= 2 && video.videoWidth > 0) {
            await faceMesh.send({ image: video });
          }
        } catch (frameErr) {
          console.warn("Lỗi gửi frame camera tới FaceMesh:", frameErr);
        }
      },
      width: 1280,
      height: 720,
      facingMode: 'user'
    });

    camera.start().catch(camErr => {
      console.error("Không thể khởi động camera:", camErr);
      const adviceEl = document.getElementById('ai-pill-advice');
      if (adviceEl) adviceEl.innerText = "Lỗi quyền truy cập Camera! Vui lòng cho phép quyền camera.";
    });
  </script>
</body>

</html>
